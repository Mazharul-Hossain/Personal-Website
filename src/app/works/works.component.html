<!--====== WORK PART START ======-->

<section class="work-area pt-25 pb-30" id="work">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="section-title text-center pb-30">
                    <h2 class="title" style="margin-top: 20px; padding: 20px;">My Recent Projects</h2>
                    <!-- <p>.</p> -->
                </div> <!-- section title -->
            </div>
        </div> <!-- row -->

        <div class="container-fluid">
            <ng-template #cdkPopup let-imageSrc let-imageName="imageName">
                <div class="popup-container" role="dialog" aria-modal="true" [attr.aria-label]="imageName + ' image preview'">
                    <button type="button" class="popup-close" cdkFocusInitial aria-label="Close image preview"
                        (click)="closeImagePopup()">Close <span aria-hidden="true">&times;</span></button>
                    <img [src]="imageSrc" [alt]="imageName + ' project preview'" class="popup-image" />
                </div>
            </ng-template>
            <div class="row flex-row flex-nowrap overflow-auto">
                <div class="col-lg-4 col-md-6 col-sm-6">
                    <div class="single-work text-center mt-30">
                        <div class="work-image">
                            <picture>
                                <source type="image/webp" srcset="assets/images/next_gen/work/w-1.webp" alt="work">
                                <img loading="lazy" alt="work" src="assets/images/work/w-1.png" width="720" height="360">
                            </picture>
                        </div>
                        <div class="work-overlay">
                            <div class="work-content">
                                <h3 class="work-title">Map901</h3>
                                <p>Indoor LiDAR and Image Dataset | Indoor Object Detection using DNN</p>
                                <ul>
                                    <li><button #map901Opener type="button" class="image-popup" aria-label="Preview Map901 image"
                                            aria-haspopup="dialog" (click)="openImagePopup('assets/images/work/w-1.png', 'Map901', map901Opener)">
                                            <i class="lni-plus" aria-hidden="true"></i></button></li>
                                    <li><a href="http://map901.memphis.edu/" target="_blank"
                                            rel="nofollow noopener noreferrer">
                                            <i class="lni-link"></i></a></li>
                                </ul>
                            </div>
                        </div>
                    </div> <!-- single work -->
                </div>

                <div class="col-lg-4 col-md-6 col-sm-6">
                    <div class="single-work text-center mt-30">
                        <div class="work-image">
                            <picture>
                                <source type="image/webp" srcset="assets/images/next_gen/work/w-2.webp" alt="work">
                                <img loading="lazy" alt="work" src="assets/images/work/w-2.png" width="715" height="360">
                            </picture>
                        </div>
                        <div class="work-overlay">
                            <div class="work-content">
                                <h3 class="work-title">Personal Website</h3>
                                <ul>
                                    <li><button #websiteOpener type="button" class="image-popup" aria-label="Preview Personal Website image"
                                            aria-haspopup="dialog" (click)="openImagePopup('assets/images/work/w-2.png', 'Personal Website', websiteOpener)">
                                            <i class="lni-plus" aria-hidden="true"></i></button></li>
                                    <li><a href="https://github.com/Mazharul-Hossain/Personal-Website" target="_blank"
                                            rel="nofollow noopener noreferrer"><i class="lni-link"></i></a></li>
                                </ul>
                            </div>
                        </div>
                    </div> <!-- single work -->
                </div>
            </div> <!-- row -->
        </div> <!-- container-fluid -->
    </div> <!-- container -->
</section>

<!--====== WORK PART ENDS ======-->
