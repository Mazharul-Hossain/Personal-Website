<!--====== FOOTER PART START ======-->

<footer id="footer" class="footer-area">
    <div class="footer-widget pt-50 pb-50">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="footer-content text-center">
                        <a href="/" aria-label="Mazharul Hossain — Home">
                            <span class="footer-identity">Mazharul Hossain</span>
                        </a>
                        <ul aria-label="Professional profiles">
                            @for (profile of socialProfiles; track profile.id) {
                                <li><a [href]="profile.href" target="_blank" rel="noopener noreferrer"
                                       [attr.aria-label]="profile.label" [title]="profile.label"><i [class]="profile.icon" aria-hidden="true"></i></a></li>
                            }
                        </ul>
                    </div> <!-- footer content -->
                </div>
            </div> <!-- row -->
        </div> <!-- container -->
    </div> <!-- footer widget -->
    <div class="footer-copyright pb-20">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">
                    <div class="copyright-text text-center pt-20">
                        <p>Adapted from a template by <a href="https://uideck.com/" target="_blank"
                                                                    rel="nofollow noopener noreferrer">UIdeck</a>
                        </p>
                    </div> <!-- copyright text -->
                </div>
                <div class="col-lg-6">
                    <div class="copyright-text text-center pt-20">
                        <p>© {{ year }} Mazharul Hossain</p>
                    </div> <!-- copyright text -->
                </div>
            </div> <!-- row -->
        </div> <!-- container -->
    </div> <!-- footer widget -->
</footer>

<!--====== FOOTER PART ENDS ======-->
