<!-- @agent Read: .agents/skills/portfolio-angular/SKILL.md; .agents/skills/portfolio-design/SKILL.md
Policy: README.md#behavioral-contracts; docs/README.md
Controller: src/app/nav-bar/nav-bar.component.ts; Styles: src/app/nav-bar/nav-bar.component.css; global order: angular.json -->
<div class="navigation fixed-top">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
                    <a class="navbar-brand" href="/" aria-label="Mazharul Hossain — Home">
                        <span class="brand-monogram" aria-hidden="true">MH</span>
                        <span class="brand-name" aria-hidden="true">Mazharul Hossain</span>
                    </a> <!-- Logo -->
                    <button class="navbar-toggler"
                            type="button"
                            aria-controls="navbarSupportedContent"
                            [attr.aria-expanded]="navbarOpen"
                            aria-label="Toggle navigation"
                            (click)="toggleNavbar()"
                            [class.active]="navbarOpen">
                        <span class="toggler-icon"></span>
                        <span class="toggler-icon"></span>
                        <span class="toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" [class.show]="navbarOpen" id="navbarSupportedContent">
                        <ul class="navbar-nav ml-auto">
                            @for (item of navigationItems; track item.id) {
                                <li class="nav-item" [class.active]="activeSection === item.id">
                                    <a class="page-scroll" [attr.data-custom-id]="item.id" [href]="'/' + item.id"
                                       [attr.aria-current]="activeSection === item.id ? 'location' : null"
                                       (click)="navigateFromLink($event, item.id)">{{ item.label }}</a>
                                </li>
                            }
                        </ul>
                    </div> <!-- navbar collapse -->
                </nav> <!-- navbar -->
            </div>
        </div> <!-- row -->
    </div> <!-- container -->
</div> <!-- navigation -->
